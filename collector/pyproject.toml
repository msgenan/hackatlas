[project]
name = "hackatlas-collector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "selectolax>=0.3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.60"]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
hackatlas = "hackatlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackatlas"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
